[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skin-cancer-benchmark"
version = "1.0.0"
description = "A reproducible CNN benchmark for malignant/benign skin-lesion classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Hatefi", email = "alihatefi@aut.ac.ir" }]
keywords = [
    "bioinformatics",
    "medical-imaging",
    "dermoscopy",
    "skin-cancer",
    "transfer-learning",
    "reproducible-research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
# TensorFlow is the training backend but is not needed to import the package, run
# the metric layer, or run most of the test suite -- which is what keeps CI fast.
train = ["tensorflow>=2.16,<2.21"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.urls]
Repository = "https://github.com/Alihaatefi/skin-cancer-cnn-benchmark"

[project.scripts]
skin-benchmark = "skin_cancer_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "tensorflow: requires a TensorFlow install (skipped automatically when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# private/ holds licensed PDFs and local scratch material; it is never committed.
extend-exclude = ["private"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # dataclass field(default_factory=...) reads as a call in a default
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
